[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/resume"
  to = "/assets/resume.pdf"
  status = 301

[[redirects]]
  from = "/cv"
  to = "/assets/resume.pdf"
  status = 301

[[redirects]]
  from = "/github"
  to = "https://github.com/indrasena-reddy"
  status = 302

[[redirects]]
  from = "/linkedin"
  to = "https://linkedin.com/in/indrasena-reddy"
  status = 302

[functions]
  directory = "netlify/functions"

[edge_functions]
  directory = "netlify/edge-functions"